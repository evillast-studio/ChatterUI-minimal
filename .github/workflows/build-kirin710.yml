name: Build APK (Kirin 710, desde fuente)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ndk-kirin710-llamarn-${{ runner.os }}
          max-size: 2G

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /root/.m2
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af 2>/dev/null || true

      - name: Crear swapfile 8GB
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Instalar dependencias npm
        run: npm install --no-audit --no-fund

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Forzar build desde fuente
        run: echo "rnllamaBuildFromSource=true" >> android/gradle.properties

      - name: Parchear CMakeLists para Kirin 710 / Cortex-A73
        run: |
          CMAKE_FILE=$(find node_modules/cui-llama.rn/android -name "CMakeLists.txt" | head -1)

          if [ -z "$CMAKE_FILE" ]; then
            echo "ERROR: CMakeLists.txt de cui-llama.rn no encontrado"
            find node_modules/cui-llama.rn/android -type f | head -20
            exit 1
          fi

          echo "✓ CMakeLists encontrado: $CMAKE_FILE"

          if grep -q "__KIRIN710_INJECTED__" "$CMAKE_FILE"; then
            echo "Parche ya aplicado, saltando."
            exit 0
          fi

          read -r -d '' K710_BLOCK << 'CMAKE_EOF' || true

          # __KIRIN710_INJECTED__
          # Kirin 710 / Cortex-A73 — aplicado por build-kirin710.yml
          # ARMv8-A puro. SIN dotprod (ARMv8.2-A) → SIGILL en A73.
          if(ANDROID AND ANDROID_ABI STREQUAL "arm64-v8a")
              set(K710_FLAGS
                  -march=armv8-a
                  -mtune=cortex-a73
                  -O3
                  -ffast-math
                  -fno-math-errno
                  -fstrict-aliasing
                  -funroll-loops
                  -fvectorize
                  -fprefetch-loop-arrays
                  -fomit-frame-pointer
                  -fno-stack-protector
                  -ffunction-sections
                  -fdata-sections
              )
              string(JOIN " " K710_FLAGS_STR ${K710_FLAGS})
              set(CMAKE_C_FLAGS   "${CMAKE_C_FLAGS} ${K710_FLAGS_STR}"   CACHE STRING "" FORCE)
              set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} ${K710_FLAGS_STR}" CACHE STRING "" FORCE)
              set(CMAKE_EXE_LINKER_FLAGS    "${CMAKE_EXE_LINKER_FLAGS} -Wl,--gc-sections -Wl,-O1 -Wl,--as-needed"    CACHE STRING "" FORCE)
              set(CMAKE_SHARED_LINKER_FLAGS "${CMAKE_SHARED_LINKER_FLAGS} -Wl,--gc-sections -Wl,-O1 -Wl,--as-needed" CACHE STRING "" FORCE)
              set(GGML_DOTPROD        OFF CACHE BOOL "A73 no tiene dotprod" FORCE)
              set(GGML_ARM_DOTPROD    OFF CACHE BOOL "" FORCE)
              set(GGML_USE_LLAMAFILE  OFF CACHE BOOL "" FORCE)
              set(GGML_NEON           ON  CACHE BOOL "A73 tiene NEON" FORCE)
              set(GGML_FP16_VA        ON  CACHE BOOL "FP16 via NEON en A73" FORCE)
              set(LLAMA_NATIVE        OFF CACHE BOOL "No auto-detectar CPU del host" FORCE)
              set(GGML_METAL          OFF CACHE BOOL "" FORCE)
              set(GGML_CUDA           OFF CACHE BOOL "" FORCE)
              set(GGML_VULKAN         OFF CACHE BOOL "Kirin 710 no tiene Vulkan Compute" FORCE)
              set(GGML_VULKAN_DEBUG   OFF CACHE BOOL "" FORCE)
              set(GGML_F16C           OFF CACHE BOOL "F16C es x86, no aplica en ARM" FORCE)
              set(GGML_OPENMP         OFF CACHE BOOL "Usar threads propios de llama.cpp" FORCE)
          endif()
          # Fin Kirin 710
          CMAKE_EOF

          python3 - "$CMAKE_FILE" "$K710_BLOCK" << 'PYEOF'
          import sys, re
          cmake_path = sys.argv[1]
          block = sys.argv[2]
          content = open(cmake_path).read()
          for pattern in [r'(project\s*\([^)]+\)\s*\n)', r'(cmake_minimum_required\s*\([^)]+\)\s*\n)']:
              m = re.search(pattern, content, re.IGNORECASE)
              if m:
                  content = content[:m.end()] + block + '\n' + content[m.end():]
                  break
          else:
              content = block + '\n' + content
          open(cmake_path, 'w').write(content)
          print(f"Parche aplicado en {cmake_path}")
          PYEOF

          echo "✓ Flags: -march=armv8-a -mtune=cortex-a73 -O3 -ffast-math -fprefetch-loop-arrays"
          echo "✓ GGML_DOTPROD=OFF GGML_NEON=ON GGML_FP16_VA=ON LLAMA_NATIVE=OFF"

      - name: Build APK release
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx12g -XX:MaxMetaspaceSize=512m" \
            -Dorg.gradle.daemon=false \
            -Pandroid.enableR8.fullMode=false \
            -Pandroid.skipVerifyVersionRanges=true \
            -x lint -x test \
            --build-cache --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: ChatterUI-Kirin710-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          
